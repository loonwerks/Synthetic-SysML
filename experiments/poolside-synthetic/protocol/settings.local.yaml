paths:
  allow:
    - path: /workspace/**
    - path: /workspace/M-star.sysml
      write: true
    - path: /opt/sireum/**
    - path: /opt/sysml-aadl-libraries/**

tools:
  shell:
    allow:
      - /opt/sireum/bin/sireum *
      - pwd
      - ls *
      - find *
      - grep *
      - head *
      - tail *
      - sed *
      - wc *
      - cat *
      - sha256sum *
